plugins {
    id 'java'
    id 'net.minecraftforge.renamer' version '1.1.5'
    id 'net.minecraftforge.gradle' version '7.0.34'
}

def target = providers.gradleProperty('probeTarget').getOrElse('110')
if (!(target in ['110', '112'])) throw new GradleException('probeTarget must be 110 or 112')
version = '1.0.0'
group = 'zone.moddev.mc.advantageworks'
base.archivesName = "AdvantageMigrationProbe-${target}"
layout.buildDirectory = file("build/${target}")
java.toolchain.languageVersion = JavaLanguageVersion.of(8)
sourceSets.main.java.srcDir '../shared-probe'
tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
minecraft {
    mappings channel: 'stable', version: target == '110' ? '29-1.10.2' : '39-1.12'
}
repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}
dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:' +
            (target == '110' ? '1.10.2-12.18.3.2511' : '1.12.2-14.23.5.2859'))
}
tasks.named('jar', Jar) {
    archiveClassifier = 'deobf'
}
def release = renamer.classes(tasks.named('jar', Jar)) {
    map.from minecraft.dependency.toSrgFile
    archiveClassifier = null
}
tasks.named('assemble') { dependsOn release }
