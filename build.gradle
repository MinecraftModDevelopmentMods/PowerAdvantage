tasks.register('prepareCombinedEclipseLaunch') {
    group = 'ide'
    description = 'Creates an additional production-only Eclipse client launch with all three Advantage mods.'
    dependsOn tasks.named('verifyEclipseProductionClasspath')
    doLast {
        def profile = new JsonSlurper().parse(file('test-rig/profiles/dev-core.json'))
        advantageExtensionJars.each { String id, File jar ->
            def pin = profile.mods.find { it.id == id }
            if (!jar.isFile()) throw new GradleException("Build ${id} first, or override its *AdvantageDeobfJar property: ${jar}")
            String hash = MessageDigest.getInstance('SHA-256').digest(jar.bytes).encodeHex().toString()
            if (pin == null || !hash.equalsIgnoreCase(pin.sha256 as String)) {
                throw new GradleException("${id} does not match the audited dev-core dependency pin: ${jar}")
            }
        }
        def launch = new groovy.xml.XmlParser().parse(file('runClient.launch'))
        def classpath = launch.listAttribute.find { it.@key == 'org.eclipse.jdt.launching.CLASSPATH' }
        if (classpath == null) throw new GradleException('Base client launch has no explicit production classpath')
        advantageExtensionJars.values().each { File jar ->
            String entry = groovy.xml.XmlUtil.serialize(new Node(null, 'runtimeClasspathEntry',
                    [externalArchive: jar.canonicalPath, type: '2', path: '5']))
            classpath.appendNode('listEntry', [value: entry])
        }
        File combined = file('runClientAllAdvantage.launch')
        combined.setText(groovy.xml.XmlUtil.serialize(launch), 'UTF-8')
        def parsed = new groovy.xml.XmlSlurper().parse(combined)
        def archivePaths = parsed.listAttribute.find {
            it.@key.text() == 'org.eclipse.jdt.launching.CLASSPATH'
        }.listEntry.collect { new groovy.xml.XmlSlurper().parseText(it.@value.text()).@externalArchive.text() }
        advantageExtensionJars.values().each { File jar ->
            if (archivePaths.count(jar.canonicalPath) != 1) throw new GradleException("Missing or repeated extension: ${jar}")
        }
        if (combined.text.contains('advantageworkstest') || combined.text.contains('client-resource-probe')
                || combined.text.contains('bin/test') || combined.text.contains('buildship.core.gradleclasspathcontainer')) {
            throw new GradleException('Combined launch leaked test code or an unfiltered classpath')
        }
        logger.lifecycle("Prepared ${combined.name}; uses the same run directory and saves as runClient.launch.")
    }
}
