import groovy.json.JsonSlurper
import java.nio.charset.StandardCharsets
import java.security.MessageDigest
import java.util.jar.Manifest
import java.util.zip.ZipFile
import org.apache.tools.ant.filters.FixCrLfFilter

plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.renamer' version '1.1.5'
    id 'net.minecraftforge.gradle' version '7.0.34'
}

// The native GUI adapter is a test mod, not a production or published source set.
sourceSets {
    guiProbe {
        java.srcDir 'test-rig/client-resources/java'
        resources.srcDir 'test-rig/client-resources/resources'
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
    }
}

tasks.register('clientResourceProbeJar', Jar) {
    group = 'verification'
    description = 'Builds the isolated native GUI capture mod, outside release artifacts.'
    dependsOn tasks.named('guiProbeClasses')
    from sourceSets.guiProbe.output
    archiveFileName = 'advantageclientresources-deobf.jar'
    destinationDirectory = layout.buildDirectory.dir('client-resource-probe')
}

group = project.mod_group
version = project.mod_version
base.archivesName = 'PowerAdvantage'

def versionParts = project.mod_version.toString().tokenize('.')
if (versionParts.size() != 4 || !versionParts.every { it ==~ /\d+/ }) {
    throw new GradleException("mod_version must use Major.Minor.Bug.Target numeric form: ${project.mod_version}")
}
def minecraftVersionParts = project.minecraft_version.toString().tokenize('.')
if (minecraftVersionParts.size() < 2 || minecraftVersionParts.size() > 3
        || !minecraftVersionParts.every { it ==~ /\d+/ }) {
    throw new GradleException("minecraft_version must use major.minor or major.minor.patch numeric form: "
            + project.minecraft_version)
}
def minecraftPatch = minecraftVersionParts.size() == 3 ? minecraftVersionParts[2] : '0'
def expectedTargetVersion = "${minecraftVersionParts[0]}" \
        + "${minecraftVersionParts[1].padLeft(2, '0')}" \
        + "${minecraftPatch.padLeft(2, '0')}" \
        + project.loader_code
if (versionParts[3] != expectedTargetVersion) {
    throw new GradleException("mod_version target ${versionParts[3]} does not match "
            + "Minecraft ${project.minecraft_version} ${project.loader_name} target ${expectedTargetVersion}")
}

ext.functional_version = versionParts[0..2].join('.')
ext.display_version = project.mod_version
ext.release_tag = project.mod_version

java {
    toolchain.languageVersion = JavaLanguageVersion.of(8)
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(8)
    }
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '1000'])
}

tasks.withType(Javadoc).configureEach {
    failOnError = false
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addBooleanOption('notimestamp', true)
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def archiveTextSuffixes = [
        '.cfg', '.css', '.html', '.info', '.java', '.js', '.json', '.lang',
        '.mcmeta', '.md', '.properties', '.txt', '.xml'
]
def archiveTextPatterns = archiveTextSuffixes.collect { "**/*${it}".toString() }
archiveTextPatterns.addAll(['**/element-list', '**/package-list'])
def normalizeArchiveLineEndings = { details ->
    details.filter(FixCrLfFilter,
            eol: FixCrLfFilter.CrLf.newInstance('lf'),
            eof: FixCrLfFilter.AddAsisRemove.newInstance('asis'))
}

minecraft {
    mappings channel: project.mapping_channel, version: project.mapping_version
    String configuredRunDirectory = providers.gradleProperty('powerAdvantageRunDirectory')
            .getOrElse('run')
    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir(configuredRunDirectory)
            systemProperty 'forge.logging.console.level', 'debug'
        }
        register('client')
        register('server') {
            args '--nogui'
        }
    }
}

// Forge 1.10 requires a single development-mod classpath root. ForgeGradle 7
// splits classes and resources, so merge only the launch output.
def forge10DevelopmentOutput = layout.buildDirectory.dir('forge10-development/main')
def syncForge10DevelopmentResources = tasks.register('syncForge10DevelopmentResources', Sync) {
    group = 'ide'
    description = 'Merges classes and processed resources for Forge 1.10 Gradle launches.'
    dependsOn tasks.named('classes')
    from tasks.named('compileJava', JavaCompile).flatMap { it.destinationDirectory }
    from sourceSets.main.output.resourcesDir
    into forge10DevelopmentOutput
}
tasks.configureEach {
    if (name == 'runClient' || name == 'runServer') {
        dependsOn syncForge10DevelopmentResources
        doFirst {
            Set<File> splitMainOutputs = [
                    tasks.named('compileJava', JavaCompile).get().destinationDirectory.get().asFile,
                    sourceSets.main.output.resourcesDir
            ] as Set<File>
            classpath = files(forge10DevelopmentOutput, classpath.filter {
                !splitMainOutputs.contains(it)
            })
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven

    if (providers.gradleProperty('rebornCoreVerificationRepository').isPresent()) {
        maven {
            name = 'RebornCoreReleaseVerificationMirror'
            url = uri(providers.gradleProperty('rebornCoreVerificationRepository').get())
            metadataSources { artifact() }
            content { includeGroup('curse.maven') }
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    mavenCentral()
    maven {
        name = 'MinecraftLibraries'
        url = 'https://libraries.minecraft.net/'
    }
    if (!providers.gradleProperty('rebornCoreVerificationRepository').isPresent()) {
        maven {
            name = 'CurseMaven'
            url = 'https://www.cursemaven.com'
            metadataSources { artifact() }
            content { includeGroup('curse.maven') }
        }
    }
}

def rfApiJar = file('libs/RF-API.jar')
def rebornCoreCoordinate = "curse.maven:reborncore-${project.reborncore_curse_project_id}:" \
        + project.reborncore_curse_file_id
// OreSpawn is a required runtime mod, but its API is supplied as a local deobf jar
// so development and CI do not depend on a historical Maven repository.
def defaultOreSpawnDeobfJar = file("../../../MinecraftMineralogy/OS110/OreSpawn/build/libs-dev/" \
        + "OreSpawn-${project.orespawn_version}-deobf.jar")
def oreSpawnDeobfJar = providers.gradleProperty('oreSpawnDeobfJar')
        .map { file(it) }
        .getOrElse(defaultOreSpawnDeobfJar)
if (!oreSpawnDeobfJar.isFile()) {
    throw new GradleException("Missing OreSpawn deobf jar: ${oreSpawnDeobfJar}. "
            + "Build pinned OreSpawn commit ${project.orespawn_source_commit} first, or pass "
            + "-PoreSpawnDeobfJar=<path>.")
}

dependencies {
    implementation minecraft.dependency(
            "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")
    // Mavenizer's legacy metadata omits this compile-time Minecraft library.
    compileOnly 'org.lwjgl.lwjgl:lwjgl_util:2.9.4-nightly-20150209'

    // These integrations are optional at runtime. Compile against their APIs,
    // but do not package or launch PowerAdvantage with the provider mods.
    compileOnly files(rfApiJar)
    compileOnly rebornCoreCoordinate
    compileOnly files(oreSpawnDeobfJar)
    runtimeOnly files(oreSpawnDeobfJar)
    testImplementation files(oreSpawnDeobfJar)
    testImplementation 'junit:junit:4.13.2'
}

tasks.named('processResources', ProcessResources) {
    filteringCharset = 'UTF-8'
    inputs.property('version', project.version)
    inputs.property('mcversion', project.minecraft_version)
    filesMatching('mcmod.info') {
        expand version: project.version, mcversion: project.minecraft_version
    }
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
}

def prepareEclipseResources = tasks.register('prepareEclipseResources') {
    group = 'ide'
    description = 'Copies Gradle-processed resources into Eclipse production output.'
    dependsOn tasks.named('processResources')
    doLast {
        project.copy {
            from(layout.buildDirectory.dir('resources/main'))
            into(layout.projectDirectory.dir('bin/main'))
        }
    }
}

tasks.named('jar', Jar) {
    archiveClassifier = 'deobf'
    destinationDirectory = layout.buildDirectory.dir('libs-dev')
    manifest {
        attributes([
                'Maven-Artifact'        : "${project.group}:${base.archivesName.get()}:${project.version}",
                'Specification-Title'   : project.mod_id,
                'Specification-Vendor'  : project.mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : base.archivesName.get(),
                'Implementation-Version': project.version,
                'Implementation-Vendor' : project.mod_authors,
                'Built-On-Java'         : project.java_version,
                'Built-On'              : "${project.minecraft_version}-${project.forge_version}"
        ])
    }
}

def releaseJar = renamer.classes(tasks.named('jar', Jar)) {
    map.from minecraft.dependency.toSrgFile
    archiveClassifier = null
}

tasks.register('deobfJar') {
    group = 'build'
    description = 'Builds the deobfuscated development jar under build/libs-dev.'
    dependsOn tasks.named('jar')
}

tasks.named('sourcesJar', Jar) {
    filteringCharset = 'UTF-8'
    includeEmptyDirs = false
    archiveClassifier = 'sources'
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
    manifest {
        attributes([
                'Maven-Artifact'        : "${project.group}:${base.archivesName.get()}:${project.version}:sources",
                'Implementation-Title'  : "${base.archivesName.get()}-sources",
                'Implementation-Version': project.version
        ])
    }
}

tasks.named('javadocJar', Jar) {
    filteringCharset = 'UTF-8'
    archiveClassifier = 'javadoc'
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
    manifest {
        attributes([
                'Maven-Artifact'        : "${project.group}:${base.archivesName.get()}:${project.version}:javadoc",
                'Implementation-Title'  : "${base.archivesName.get()}-javadoc",
                'Implementation-Version': project.version
        ])
    }
}

['apiElements', 'runtimeElements'].each { configurationName ->
    configurations.named(configurationName) { artifacts.clear() }
    artifacts { add(configurationName, releaseJar) }
}

tasks.named('assemble') {
    dependsOn releaseJar
    dependsOn tasks.named('sourcesJar')
    dependsOn tasks.named('javadocJar')
}

def expectedReleaseFiles = providers.provider {
    def prefix = "${base.archivesName.get()}-${project.version}"
    ["${prefix}.jar", "${prefix}-sources.jar", "${prefix}-javadoc.jar"]
}
def preparedReleaseDir = providers.gradleProperty('preparedReleaseDir')

tasks.register('verifyReleaseConfiguration') {
    group = 'verification'
    description = 'Validates release identity, target metadata, and optional integration policy.'
    doLast {
        if (project.mod_version != '2.4.3.110021') {
            throw new GradleException("Unexpected PowerAdvantage release version: ${project.mod_version}")
        }
        if (project.minecraft_version != '1.10.2'
                || project.forge_version != '12.18.3.2511'
                || project.mapping_channel != 'stable'
                || project.mapping_version != '29-1.10.2') {
            throw new GradleException('Unexpected Minecraft, Forge, or mappings target')
        }
        if (project.loader_name != 'forge' || project.loader_code != '1'
                || project.java_version != '8'
                || project.java_toolchain_version != '8.0.502+7'
                || project.gradle_java_version != '17') {
            throw new GradleException('Unexpected release dispatcher target metadata')
        }
        if (project.mod_id != 'poweradvantage'
                || project.group.toString() != 'zone.moddev.mc.poweradvantage'
                || base.archivesName.get() != 'PowerAdvantage'
                || project.curseforge_project_id != '240982') {
            throw new GradleException('Unexpected Forge, Maven, archive, or CurseForge identity')
        }
        if (project.cf_requirements != 'base-metals,mmd-orespawn'
                || project.cf_optionals != 'additional-loot-tables'
                || project.cf_versions != '1.10.2') {
            throw new GradleException('Unexpected CurseForge dependency or game-version metadata')
        }
        if (project.reborncore_curse_project_id != '237903'
                || project.reborncore_curse_file_id != '2425028'
                || project.reborncore_version != '2.13.6.142'
                || project.reborncore_sha256 != 'C7C0D57FFC65B056D3795EBF60912EF5C6333009F33FAEEDA804BE4C22626C99') {
            throw new GradleException('Unexpected RebornCore compile API identity')
        }
        if (project.orespawn_version != '4.0.8.110021'
                || project.orespawn_source_repository != 'MinecraftModDevelopmentMods/OreSpawn'
                || project.orespawn_source_commit != '5a50df1158e948c8db55814e819090b34c12d765'
                || project.orespawn_deobf_sha256 != '33BFB8C9D626D071147A0952A74B633F0BCC6A27E0408B4524370F4833B003C2') {
            throw new GradleException('Unexpected OreSpawn API dependency identity')
        }
        ['.github/workflows/ci.yml', '.github/workflows/codeql-analysis.yml'].each { workflowPath ->
            String workflow = file(workflowPath).getText('UTF-8')
            if (!workflow.contains('repository: ' + project.orespawn_source_repository)
                    || !workflow.contains('ref: ' + project.orespawn_source_commit)) {
                throw new GradleException("${workflowPath} does not build the pinned OreSpawn source")
            }
        }
        String mainSource = file(
                'src/main/java/zone/moddev/mc/poweradvantage/PowerAdvantage.java').getText('UTF-8')
        if (!mainSource.contains('MODID = "poweradvantage"')
                || !mainSource.contains('VERSION = "2.4.3.110021"')
                || !mainSource.contains('required-after:orespawn@[4.0.6,5.0.0);after:basemetals')) {
            throw new GradleException('PowerAdvantage source identity or dependency policy changed')
        }
        if (!file('src/main/java/cyano/poweradvantage/api/PoweredEntity.java').isFile()) {
            throw new GradleException('Legacy cyano.poweradvantage.api compatibility surface is missing')
        }
        def metadata = new JsonSlurper().parse(file('src/main/resources/mcmod.info'))
        def mod = metadata instanceof List ? metadata.first() : metadata
        if (mod.modid != 'poweradvantage') {
            throw new GradleException('Source mcmod.info does not use the stable poweradvantage mod id')
        }
    }
}

tasks.register('verifyReleaseDependencies') {
    group = 'verification'
    description = 'Resolves and audits Forge plus the exact optional compile APIs.'
    dependsOn tasks.named('verifyReleaseConfiguration')
    doLast {
        if (!rfApiJar.isFile()) {
            throw new GradleException("Missing tracked RF API jar: ${rfApiJar}")
        }
        String actualRfHash = MessageDigest.getInstance('SHA-256')
                .digest(rfApiJar.bytes).encodeHex().toString().toUpperCase()
        if (actualRfHash != project.rf_api_sha256) {
            throw new GradleException("RF API SHA-256 is ${actualRfHash}, expected ${project.rf_api_sha256}")
        }
        String actualOreSpawnHash = MessageDigest.getInstance('SHA-256')
                .digest(oreSpawnDeobfJar.bytes).encodeHex().toString().toUpperCase()
        if (actualOreSpawnHash != project.orespawn_deobf_sha256) {
            throw new GradleException("OreSpawn SHA-256 is ${actualOreSpawnHash}, expected "
                    + project.orespawn_deobf_sha256)
        }
        new ZipFile(oreSpawnDeobfJar).withCloseable { zip ->
            ['zone/moddev/mc/orespawn/api/OreSpawnApi.class',
             'zone/moddev/mc/orespawn/api/WorldgenProvider.class'].each { required ->
                if (zip.getEntry(required) == null) {
                    throw new GradleException("OreSpawn API jar is missing ${required}")
                }
            }
        }

        def compileArtifacts = configurations.compileClasspath.resolvedConfiguration.resolvedArtifacts
        def rebornCoreArtifacts = compileArtifacts.findAll { artifact ->
            def id = artifact.moduleVersion.id
            id.group == 'curse.maven' && id.name == "reborncore-${project.reborncore_curse_project_id}"
        }
        String expectedRebornCore = rebornCoreCoordinate.toString()
        if (rebornCoreArtifacts.size() != 1
                || "${rebornCoreArtifacts.first().moduleVersion.id.group}:"
                + "${rebornCoreArtifacts.first().moduleVersion.id.name}:"
                + "${rebornCoreArtifacts.first().moduleVersion.id.version}" != expectedRebornCore) {
            throw new GradleException("Expected exactly ${expectedRebornCore}, found "
                    + rebornCoreArtifacts.collect { it.moduleVersion.id })
        }
        File rebornCoreJar = rebornCoreArtifacts.first().file
        String actualRebornCoreHash = MessageDigest.getInstance('SHA-256')
                .digest(rebornCoreJar.bytes).encodeHex().toString().toUpperCase()
        if (actualRebornCoreHash != project.reborncore_sha256) {
            throw new GradleException("RebornCore SHA-256 is ${actualRebornCoreHash}, expected "
                    + project.reborncore_sha256)
        }
        new ZipFile(rebornCoreJar).withCloseable { zip ->
            ['reborncore/api/power/IEnergyInterfaceTile.class',
             'reborncore/api/power/EnumPowerTier.class'].each { required ->
                if (zip.getEntry(required) == null) {
                    throw new GradleException("RebornCore compile API is missing ${required}")
                }
            }
        }

        Set<File> compileFiles = configurations.compileClasspath.files.collect { it.canonicalFile } as Set<File>
        if (!compileFiles.contains(rfApiJar.canonicalFile)
                || !compileFiles.contains(rebornCoreJar.canonicalFile)
                || !compileFiles.contains(oreSpawnDeobfJar.canonicalFile)) {
            throw new GradleException('A required compile API is missing from compileClasspath')
        }
        Set<File> runtimeFiles = configurations.runtimeClasspath.files.collect { it.canonicalFile } as Set<File>
        if (runtimeFiles.contains(rfApiJar.canonicalFile)
                || runtimeFiles.contains(rebornCoreJar.canonicalFile)) {
            throw new GradleException('Optional RF or RebornCore API leaked onto runtimeClasspath')
        }
        if (!runtimeFiles.contains(oreSpawnDeobfJar.canonicalFile)) {
            throw new GradleException('Required OreSpawn mod is missing from development runtimeClasspath')
        }
        List<String> forbiddenRuntimeMods = runtimeFiles.collect { it.name.toLowerCase(Locale.ROOT) }
                .findAll { name ->
                    name.contains('basemetals') || name.contains('tesla') || name.contains('reborncore')
                }
        if (!forbiddenRuntimeMods.isEmpty()) {
            throw new GradleException("Optional mods leaked onto runtimeClasspath: ${forbiddenRuntimeMods}")
        }
    }
}

tasks.register('verifyReleaseArtifacts') {
    group = 'verification'
    description = 'Audits the exact three distributable jars and release-critical contents.'
    dependsOn tasks.named('verifyReleaseDependencies')
    dependsOn tasks.named('assemble')
    doLast {
        File libs = layout.buildDirectory.dir('libs').get().asFile
        List<File> jars = (libs.listFiles() ?: [] as File[])
                .findAll { it.name.endsWith('.jar') }.sort { it.name }
        List<String> expected = expectedReleaseFiles.get().sort()
        if (jars.collect { it.name } != expected) {
            throw new GradleException("Expected exactly ${expected}, found ${jars.collect { it.name }}")
        }
        jars.each { candidate ->
            if (candidate.length() == 0L) {
                throw new GradleException("Empty release artifact: ${candidate.name}")
            }
            new ZipFile(candidate).withCloseable { candidateZip ->
                candidateZip.entries().findAll { entry ->
                    !entry.isDirectory()
                            && (archiveTextSuffixes.any { entry.name.endsWith(it) }
                            || entry.name.endsWith('/element-list')
                            || entry.name.endsWith('/package-list'))
                }.each { entry ->
                    boolean containsCarriageReturn = candidateZip.getInputStream(entry).withCloseable { input ->
                        input.bytes.any { value -> value == 13 }
                    }
                    if (containsCarriageReturn) {
                        throw new GradleException(
                                "${candidate.name}!/${entry.name} does not use canonical LF line endings")
                    }
                }
            }
        }

        File mainJar = new File(libs, expectedReleaseFiles.get()[0])
        new ZipFile(mainJar).withCloseable { zip ->
            List<String> names = zip.entries().collect { it.name }
            ['mcmod.info', 'pack.mcmeta',
             'zone/moddev/mc/poweradvantage/PowerAdvantage.class',
             'cyano/poweradvantage/api/PoweredEntity.class',
             'cyano/poweradvantage/api/fluid/FluidNetworkApi.class',
             'com/mcmoddev/poweradvantage/math/Integer2D.class',
             'com/mcmoddev/poweradvantage/registry/ITileEntityGUI.class',
             'com/mcmoddev/poweradvantage/conduitnetwork/ConduitRegistry.class',
             'com/mcmoddev/poweradvantage/init/Fluids.class',
             'assets/poweradvantage/lang/en_US.lang'].each { required ->
                if (!names.contains(required)) {
                    throw new GradleException("Release jar is missing ${required}")
                }
            }
            def allowedLegacyClasses = [
                    'com/mcmoddev/poweradvantage/math/Integer2D.class',
                    'com/mcmoddev/poweradvantage/registry/ITileEntityGUI.class',
                    'com/mcmoddev/poweradvantage/conduitnetwork/ConduitRegistry.class',
                    'com/mcmoddev/poweradvantage/init/Fluids.class'
            ] as Set
            def legacyImplementationClasses = names.findAll {
                it.startsWith('com/mcmoddev/poweradvantage/') && it.endsWith('.class')
            } as Set
            if (legacyImplementationClasses != allowedLegacyClasses) {
                throw new GradleException("Unexpected legacy implementation classes: "
                        + "${legacyImplementationClasses - allowedLegacyClasses}; missing: "
                        + "${allowedLegacyClasses - legacyImplementationClasses}")
            }
            ['agent-notes/', '.codex/', 'src/test/', 'com/mcmoddev/advantageworks/',
             'zone/moddev/mc/advantageworks/',
             'assets/advantageworkstest/', 'cofh/api/', 'reborncore/api/',
             'zone/moddev/mc/orespawn/', 'com/mcmoddev/orespawn/',
             'net/minecraft/', 'net/minecraftforge/'].each { forbidden ->
                if (names.any { it.contains(forbidden) }) {
                    throw new GradleException("Release jar contains forbidden entry matching ${forbidden}")
                }
            }
            def metadata = new JsonSlurper().parseText(zip.getInputStream(zip.getEntry('mcmod.info'))
                    .getText(StandardCharsets.UTF_8.name()))
            def mod = metadata instanceof List ? metadata.first() : metadata
            if (mod.modid != project.mod_id || mod.version != project.mod_version
                    || mod.mcversion != project.minecraft_version) {
                throw new GradleException('Packaged mcmod.info identity, version, or target is incorrect')
            }
            def manifest = new Manifest(zip.getInputStream(zip.getEntry('META-INF/MANIFEST.MF'))).mainAttributes
            if (manifest.getValue('Implementation-Version') != project.mod_version
                    || manifest.getValue('Built-On-Java') != project.java_version
                    || manifest.getValue('Implementation-Timestamp') != null
                    || manifest.getValue('Timestamp') != null) {
                throw new GradleException('Release manifest identity is incorrect or volatile')
            }
            zip.entries().findAll { it.name.endsWith('.class') }.each { entry ->
                byte[] header = new byte[8]
                zip.getInputStream(entry).withCloseable { input ->
                    if (input.read(header) != header.length) {
                        throw new GradleException("Cannot inspect bytecode header for ${entry.name}")
                    }
                }
                int major = ((header[6] & 0xff) << 8) | (header[7] & 0xff)
                if (major != 52) {
                    throw new GradleException("${entry.name} uses Java class major ${major}, expected 52")
                }
            }
        }

        new ZipFile(new File(libs, expectedReleaseFiles.get()[1])).withCloseable { sourceZip ->
            if (sourceZip.getEntry('zone/moddev/mc/poweradvantage/PowerAdvantage.java') == null
                    || sourceZip.getEntry('cyano/poweradvantage/api/PoweredEntity.java') == null
                    || sourceZip.getEntry('cyano/poweradvantage/api/fluid/FluidNetworkApi.java') == null) {
                throw new GradleException('Sources jar is missing implementation or legacy API sources')
            }
        }
        new ZipFile(new File(libs, expectedReleaseFiles.get()[2])).withCloseable { javadocZip ->
            if (javadocZip.getEntry('index.html') == null) {
                throw new GradleException('Javadoc jar is missing index.html')
            }
        }
    }
}

tasks.register('writeReleaseChecksums') {
    group = 'verification'
    description = 'Writes SHA-256 checksums for the audited release jars.'
    dependsOn tasks.named('verifyReleaseArtifacts')
    def outputFile = layout.buildDirectory.file('release/SHA256SUMS')
    outputs.file(outputFile)
    doLast {
        File output = outputFile.get().asFile
        output.parentFile.mkdirs()
        File libs = layout.buildDirectory.dir('libs').get().asFile
        String contents = expectedReleaseFiles.get().sort().collect { name ->
            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            new File(libs, name).withInputStream { input ->
                byte[] buffer = new byte[8192]
                for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
                    if (read > 0) digest.update(buffer, 0, read)
                }
            }
            "${digest.digest().encodeHex().toString().toUpperCase()}  ${name}"
        }.join('\n') + '\n'
        output.setText(contents, 'UTF-8')
    }
}

tasks.register('verifyPreparedReleaseArtifacts') {
    group = 'verification'
    description = 'Audits an immutable release bundle before Maven publication.'
    doLast {
        if (!preparedReleaseDir.isPresent()) {
            throw new GradleException('preparedReleaseDir is required for prepared artifact publication')
        }
        File prepared = file(preparedReleaseDir.get())
        List<String> expected = expectedReleaseFiles.get().sort()
        List<File> jars = (prepared.listFiles() ?: [] as File[])
                .findAll { it.name.endsWith('.jar') }.sort { it.name }
        if (!prepared.isDirectory() || jars.collect { it.name } != expected
                || jars.any { it.length() == 0L }) {
            throw new GradleException("Prepared release must contain exactly the non-empty jars ${expected}")
        }
        File checksums = new File(prepared, 'SHA256SUMS')
        File changelog = new File(prepared, 'CHANGELOG.txt')
        if (!checksums.isFile() || !changelog.isFile()) {
            throw new GradleException('Prepared release is missing SHA256SUMS or CHANGELOG.txt')
        }
        List<String> actualChecksums = jars.collect { candidate ->
            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            candidate.withInputStream { input ->
                byte[] buffer = new byte[8192]
                for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
                    if (read > 0) digest.update(buffer, 0, read)
                }
            }
            "${digest.digest().encodeHex().toString().toUpperCase()}  ${candidate.name}"
        }.sort()
        List<String> declaredChecksums = checksums.readLines('UTF-8')
                .findAll { !it.trim().isEmpty() }.sort()
        if (actualChecksums != declaredChecksums) {
            throw new GradleException('Prepared release checksums do not match the immutable jars')
        }
    }
}

def mavenUploadUrl = providers.environmentVariable('MAVEN_UPLOAD_URL')
        .orElse('https://invalid.invalid/missing-maven-upload-url')
def mavenUploadUsername = providers.environmentVariable('MAVEN_UPLOAD_USERNAME')
def mavenUploadPassword = providers.environmentVariable('MAVEN_UPLOAD_PASSWORD')

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = project.group.toString()
            artifactId = base.archivesName.get()
            version = project.version.toString()
            if (preparedReleaseDir.isPresent()) {
                File prepared = file(preparedReleaseDir.get())
                artifact(new File(prepared, expectedReleaseFiles.get()[0]))
                artifact(new File(prepared, expectedReleaseFiles.get()[1])) { classifier = 'sources' }
                artifact(new File(prepared, expectedReleaseFiles.get()[2])) { classifier = 'javadoc' }
            } else {
                artifact(releaseJar)
                artifact(tasks.named('sourcesJar'))
                artifact(tasks.named('javadocJar'))
            }
            pom {
                name = 'Power Advantage'
                description = project.mod_description
                url = 'https://github.com/MinecraftModDevelopmentMods/PowerAdvantage'
                licenses {
                    license {
                        name = 'GNU Lesser General Public License, Version 3'
                        url = 'https://www.gnu.org/licenses/lgpl-3.0.txt'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/MinecraftModDevelopmentMods/PowerAdvantage.git'
                    developerConnection = 'scm:git:ssh://git@github.com/MinecraftModDevelopmentMods/PowerAdvantage.git'
                    url = 'https://github.com/MinecraftModDevelopmentMods/PowerAdvantage'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'release'
            url = uri(mavenUploadUrl.get())
            credentials {
                username = mavenUploadUsername.orNull ?: ''
                password = mavenUploadPassword.orNull ?: ''
            }
        }
    }
}

tasks.register('validateMavenReleaseCredentials') {
    group = 'publishing'
    description = 'Prevents Maven publication from using a local or incomplete destination.'
    doLast {
        if (!providers.environmentVariable('MAVEN_UPLOAD_URL').isPresent()
                || !mavenUploadUsername.isPresent() || !mavenUploadPassword.isPresent()) {
            throw new GradleException(
                    'MAVEN_UPLOAD_URL, MAVEN_UPLOAD_USERNAME, and MAVEN_UPLOAD_PASSWORD are required')
        }
        if (providers.environmentVariable('MAVEN_UPLOAD_URL').get().startsWith('file:')) {
            throw new GradleException('Maven release publication must use a remote repository')
        }
    }
}

tasks.withType(PublishToMavenRepository).configureEach {
    dependsOn tasks.named('validateMavenReleaseCredentials')
    dependsOn preparedReleaseDir.isPresent()
            ? tasks.named('verifyPreparedReleaseArtifacts')
            : tasks.named('verifyReleaseArtifacts')
}

idea {
