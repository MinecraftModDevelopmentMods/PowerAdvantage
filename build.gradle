tasks.register('configureEclipseBuildship') {
    group = 'ide'
    description = 'Creates Buildship preferences for ForgeGradle 7 Eclipse imports.'
    doLast {
        File preferencesFile = file('.settings/org.eclipse.buildship.core.prefs')
        Properties preferences = new Properties()
        [
                'eclipse.preferences.version'    : '1',
                'connection.gradle.distribution': 'GRADLE_DISTRIBUTION(WRAPPER)',
                'connection.gradle.user.home'   : gradle.gradleUserHomeDir.canonicalPath,
                'connection.project.dir'        : '',
                'gradle.user.home'               : gradle.gradleUserHomeDir.canonicalPath,
                'override.workspace.settings'   : 'true'
        ].each { key, value -> preferences.setProperty(key, value) }
        preferencesFile.parentFile.mkdirs()
        preferencesFile.withOutputStream {
            preferences.store(it,
                    'Generated by configureEclipseBuildship; keep Eclipse and command-line caches aligned.')
        }
    }
}

tasks.register('isolateEclipseProductionRuns') {
    group = 'ide'
    description = 'Normalizes ForgeGradle Eclipse launches for production-only execution.'
    dependsOn tasks.named('genEclipseRuns')
    dependsOn tasks.named('configureEclipseBuildship')
    dependsOn prepareEclipseResources
    doLast {
        obsoleteForgeGradle2EclipseLaunches.each { String name, String mainClass ->
            File launch = file(name)
            if (launch.isFile()) {
                String contents = launch.getText('UTF-8')
                String obsoleteMainType =
                        "org.eclipse.jdt.launching.MAIN_TYPE\" value=\"${mainClass}\""
                if (contents.contains(obsoleteMainType) && !launch.delete()) {
                    throw new GradleException("Could not remove obsolete ForgeGradle 2 launch ${name}")
                }
            }
        }
        ['runClient.launch', 'runServer.launch'].each { name ->
            File launch = file(name)
            if (!launch.isFile()) {
                throw new GradleException("ForgeGradle did not generate ${name}")
            }
            String contents = launch.getText('UTF-8')
            if (!contents.contains('org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE')) {
                String marker = '</launchConfiguration>'
                String attribute =
                        '  <booleanAttribute key="org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE" value="true"/>'
                contents = contents.replace(marker, attribute + '\n' + marker)
            }
            ['--cache', '--metadata', '--to-srg', '--to-obf'].each { option ->
                String prefix = option + ' '
                int valueStart = contents.indexOf(prefix)
                if (valueStart < 0) {
                    throw new GradleException("${name} is missing Slime Launcher argument ${option}")
                }
                valueStart += prefix.length()
                int valueEnd = contents.indexOf(' --', valueStart)
                if (valueEnd < 0) {
                    throw new GradleException("${name} has malformed Slime Launcher argument ${option}")
                }
                String value = contents.substring(valueStart, valueEnd)
                if (value.find(/\s/) != null && !value.startsWith('&quot;')) {
                    contents = (contents.substring(0, valueStart)
                            + '&quot;' + value + '&quot;' + contents.substring(valueEnd))
                }
            }
            launch.setText(contents.replace('\r\n', '\n'), 'UTF-8')
        }
    }
}

tasks.register('verifyEclipseProductionClasspath') {
    group = 'verification'
    description = 'Verifies the generated Eclipse project and production launches.'
    dependsOn tasks.named('eclipse')
    dependsOn tasks.named('isolateEclipseProductionRuns')
    doLast {
        File preferencesFile = file('.settings/org.eclipse.buildship.core.prefs')
        Properties preferences = new Properties()
        preferencesFile.withInputStream { preferences.load(it) }
        if (preferences.getProperty('connection.gradle.distribution') != 'GRADLE_DISTRIBUTION(WRAPPER)'
                || file(preferences.getProperty('connection.gradle.user.home', '')).canonicalFile
                != gradle.gradleUserHomeDir.canonicalFile) {
            throw new GradleException('Eclipse Buildship does not use this wrapper and Gradle home')
        }
        String projectMetadata = file('.project').getText('UTF-8')
        if (!projectMetadata.contains('org.eclipse.buildship.core.gradleprojectnature')
                || !projectMetadata.contains('org.eclipse.buildship.core.gradleprojectbuilder')) {
            throw new GradleException('Eclipse project metadata is missing its Buildship nature or builder')
        }
        File eclipseModMetadata = file('bin/main/mcmod.info')
        def eclipseMetadata = new JsonSlurper().parseText(eclipseModMetadata.getText('UTF-8'))
        def eclipseMod = eclipseMetadata instanceof List ? eclipseMetadata.first() : eclipseMetadata
        if (eclipseMod.modid != project.mod_id || eclipseMod.version != project.mod_version
                || eclipseMod.mcversion != project.minecraft_version) {
            throw new GradleException('Eclipse output contains incorrect mod metadata')
        }
        ['runClient.launch', 'runServer.launch'].each { name ->
            String contents = file(name).getText('UTF-8').replace('\\', '/')
            if (!contents.contains('org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE')
                    || !contents.contains('value="true"')
                    || contents.contains('src/test') || contents.contains('bin/test')) {
                throw new GradleException("${name} does not isolate production code")
            }
            if (!contents.contains('PROJECT_ATTR" value="PowerAdvantage"')) {
                throw new GradleException("${name} targets the wrong Eclipse project")
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyReleaseConfiguration')
}

tasks.register('prepareGuiProbeLaunch') {
    group = 'verification'
    description = 'Writes a separate native GUI capture launch with an explicit runtime-only classpath.'
    dependsOn tasks.named('genEclipseRuns')
    inputs.file(layout.projectDirectory.file('runClient.launch'))
    inputs.files(configurations.runtimeClasspath)
    def bootstrapOverride = providers.gradleProperty('guiProbeBootstrapJar')
    if (bootstrapOverride.isPresent()) {
        inputs.file(bootstrapOverride.map { file(it) })
    }
    outputs.file(layout.buildDirectory.file('client-resource-probe/runClientGuiProbe.launch'))
    doLast {
        File template = file('runClient.launch')
        def launch = new groovy.xml.XmlParser(false, false).parse(template)
        def stringAttribute = { String key ->
            def attributes = launch.stringAttribute.findAll { it.attribute('key') == key }
            if (attributes.size() != 1) {
                throw new GradleException("GUI launch needs exactly one ${key} attribute")
            }
            attributes.first()
        }
        if (stringAttribute('org.eclipse.jdt.launching.MAIN_TYPE').attribute('value')
                != 'net.minecraftforge.launcher.Main') {
            throw new GradleException('GUI capture requires the native ForgeGradle Slime Launcher')
        }

        def environment = launch.mapAttribute.find {
            it.attribute('key') == 'org.eclipse.debug.core.environmentVariables'
        }
        if (environment == null) {
            throw new GradleException('GUI launch is missing its native Forge environment')
        }
        [MC_VERSION: project.minecraft_version,
         FORGE_VERSION: project.forge_version,
         MCP_MAPPINGS: "${project.mapping_channel}_${project.mapping_version}"].each { key, value ->
            def entry = environment.mapEntry.find { it.attribute('key') == key }
            if (entry == null || entry.attribute('value') != value.toString()) {
                throw new GradleException("GUI launch has an unexpected ${key}")
            }
        }

        def program = stringAttribute('org.eclipse.jdt.launching.PROGRAM_ARGUMENTS')
        String arguments = program.attribute('value')
        if (!arguments.contains('--main net.minecraftforge.legacydev.MainClient ')
                || arguments.find(/--(?:server|port|gameDir|world)\b/) != null) {
            throw new GradleException('GUI capture requires a client launch without a world or server target')
        }
        ['--cache', '--metadata', '--to-srg', '--to-obf'].each { String option ->
            int start = arguments.indexOf(option + ' ')
            int end = start < 0 ? -1 : arguments.indexOf(' --', start + option.length() + 1)
            if (start < 0 || end < 0) {
                throw new GradleException("GUI launch is missing a complete ${option} argument")
            }
            start += option.length() + 1
            String value = arguments.substring(start, end)
            if (value.find(/\s/) != null && !value.startsWith('"')) {
                arguments = arguments.substring(0, start) + '"' + value + '"' + arguments.substring(end)
            }
        }
        program.attributes().put('value', arguments)

        def classpathLists = launch.listAttribute.findAll {
            it.attribute('key') == 'org.eclipse.jdt.launching.CLASSPATH'
        }
        if (classpathLists.size() != 1) {
            throw new GradleException('GUI launch needs exactly one generated classpath')
        }
        // Never use Buildship/project outputs here: the runner supplies hash-bound
        // Advantage and probe jars in its disposable mods directory.
        Set<File> runtime = new LinkedHashSet<>(configurations.runtimeClasspath.files.collect {
            it.canonicalFile
        })
        classpathLists.first().listEntry.each { entry ->
            def parsed = new groovy.xml.XmlParser(false, false).parseText(entry.attribute('value'))
            String archive = parsed.attribute('externalArchive')
            if (archive != null) runtime.add(file(archive).canonicalFile)
        }
        // Older cached 1.10 Mavenizer metadata may omit legacydev. An explicit
        // test-launch override avoids changing any production dependency/pin.
        if (bootstrapOverride.isPresent()) {
            runtime.add(file(bootstrapOverride.get()).canonicalFile)
        }
        String mappedForge = "forge-${project.minecraft_version}-${project.forge_version}-" \
                + "${project.mapping_channel}-${project.mapping_version}.jar"
        if (!runtime.any { it.name == mappedForge }
                || !runtime.any { it.name.startsWith('legacydev-') && it.name.endsWith('.jar') }) {
            throw new GradleException('GUI launch is missing its native mapped Forge/legacydev runtime. '
                    + 'For old metadata, pass -PguiProbeBootstrapJar=<existing-legacydev-fatjar>.')
        }
        if (runtime.any { !it.isFile() || it.path.replace('\\', '/').find(/\/(?:bin|classes)\/test(?:\/|$)/) != null }) {
            throw new GradleException('GUI runtime must contain existing dependency archives, not test output')
        }
        launch.remove(classpathLists.first())
        def classpath = launch.appendNode('listAttribute', [key: 'org.eclipse.jdt.launching.CLASSPATH'])
        runtime.each { File archive ->
            StringWriter entry = new StringWriter()
            new groovy.xml.MarkupBuilder(entry).runtimeClasspathEntry(
                    externalArchive: archive.canonicalPath, type: '2', path: '5')
            classpath.appendNode('listEntry', [value: entry.toString()])
        }
        ['org.eclipse.jdt.launching.DEFAULT_CLASSPATH': 'false',
         'org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE': 'true'].each { key, value ->
            launch.booleanAttribute.findAll { it.attribute('key') == key }.each { launch.remove(it) }
            launch.appendNode('booleanAttribute', [key: key, value: value])
        }
        File output = layout.buildDirectory.file('client-resource-probe/runClientGuiProbe.launch').get().asFile
        output.parentFile.mkdirs()
        output.setText(groovy.xml.XmlUtil.serialize(launch).replace('\r\n', '\n'), 'UTF-8')
        logger.lifecycle("Native GUI capture launch: ${output}")
    }
}
