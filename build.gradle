        downloadJavadoc = true
    }
}

def obsoleteForgeGradle2EclipseLaunches = [
        'PowerAdvantage_Client.launch': 'GradleStart',
        'PowerAdvantage_Server.launch': 'GradleStartServer'
]

eclipse {
    project {
        buildCommand 'org.eclipse.buildship.core.gradleprojectbuilder'
        natures 'org.eclipse.buildship.core.gradleprojectnature'
    }
    classpath {
        downloadSources = true
        downloadJavadoc = true
    }
    synchronizationTasks 'isolateEclipseProductionRuns'
