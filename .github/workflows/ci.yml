name: Power Advantage 1.13 CI

on:
  push:
    branches: [master-1.13.2, 'feature/**']
  pull_request:
    branches: [master-1.13.2]

permissions:
  contents: read

concurrency:
  group: poweradvantage-1.13-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out PowerAdvantage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check out pinned OreSpawn
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MinecraftModDevelopmentMods/OreSpawn
          ref: 6a7c2bb07b9a7771128812fcc07d185f7d9df58b
          path: .ci-dependencies/OreSpawn
      - name: Use canonical LF dependency inputs
        # Base Metals predates archive text normalization; its LF artifact is separately pinned.
        run: git config --global core.autocrlf false
      - name: Check out pinned Base Metals
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MinecraftModDevelopmentMods/BaseMetals
          ref: 1376a20d7d5ba22d3abc77dc34b49a2c88943697
          path: .ci-dependencies/BaseMetals
      - name: Install Java 8 toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8.0.502+7'
      - name: Install Java 17 for Gradle
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: microsoft
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Build pinned development dependencies
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          orespawn="$GITHUB_WORKSPACE/.ci-dependencies/OreSpawn"
          basemetals="$GITHUB_WORKSPACE/.ci-dependencies/BaseMetals"
          chmod +x "$orespawn/gradlew" "$basemetals/gradlew"
          (cd "$orespawn" && ./gradlew jar --no-daemon --stacktrace)
          (cd "$basemetals" && ./gradlew jar --no-daemon --stacktrace)
          osjar="$orespawn/build/libs-dev/OreSpawn-4.1.0.113021-deobf.jar"
          bmjar="$basemetals/build/libs-dev/BaseMetals-3.0.1.113021-deobf.jar"
          test -f "$osjar" && test -f "$bmjar"
          echo "orespawn=$osjar" >> "$GITHUB_OUTPUT"
          echo "basemetals=$bmjar" >> "$GITHUB_OUTPUT"
      - name: Build and audit release artifacts
        run: >-
          ./gradlew clean check build javadoc verifyReleaseDependencies verifyReleaseArtifacts
          writeReleaseChecksums verifyEclipseProductionClasspath
          -PbaseMetalsDeobfJar=${{ steps.dependencies.outputs.basemetals }}
          -PoreSpawnDeobfJar=${{ steps.dependencies.outputs.orespawn }}
          --no-daemon --stacktrace
      - name: Upload audited release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: PowerAdvantage-1.13.2-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/libs/PowerAdvantage-2.4.4.113021.jar
            build/libs/PowerAdvantage-2.4.4.113021-sources.jar
            build/libs/PowerAdvantage-2.4.4.113021-javadoc.jar
            build/release/SHA256SUMS
            CHANGELOG.txt
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: PowerAdvantage-1.13.2-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/test-results/**
            build/reports/**
            build/*-run/logs/**
            build/problems/**
