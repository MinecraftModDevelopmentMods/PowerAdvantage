name: Power Advantage 1.12 CI

on:
  push:
    branches:
      - master-1.12.2
      - 'feature/**'
  pull_request:
    branches:
      - master-1.12.2

permissions:
  contents: read

concurrency:
  group: poweradvantage-1.12-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Java 8 toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8.0.502+7'

      - name: Install Java 17 for Gradle
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: microsoft
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Stage exact RebornCore compile API
        id: reborncore
        run: |
          mirror="$RUNNER_TEMP/reborncore-mirror"
          bash gradle/stage-reborncore-release.sh "$mirror"
          echo "repository=$mirror" >> "$GITHUB_OUTPUT"

      - name: Build and audit release artifacts
        run: >-
          ./gradlew clean check build javadoc verifyReleaseDependencies verifyReleaseArtifacts
          writeReleaseChecksums verifyEclipseProductionClasspath
          -PrebornCoreVerificationRepository=${{ steps.reborncore.outputs.repository }}
          --no-daemon --stacktrace

      - name: Upload audited release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: PowerAdvantage-1.12.2-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/libs/PowerAdvantage-2.4.1.112021.jar
            build/libs/PowerAdvantage-2.4.1.112021-sources.jar
            build/libs/PowerAdvantage-2.4.1.112021-javadoc.jar
            build/release/SHA256SUMS
            CHANGELOG.txt

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: PowerAdvantage-1.12.2-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/test-results/**
            build/reports/**
            build/*-run/logs/**
            build/problems/**
